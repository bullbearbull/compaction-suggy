<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compaction Suggy — ChatGPT &amp; Claude</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">⇄</div>
        <div>
          <h1 class="brand-title">Compaction Suggy</h1>
          <p class="brand-sub" id="statusSubtitle">ChatGPT &amp; Claude.ai 주제 전환 감지</p>
        </div>
      </div>
      <label class="switch" title="확장 기능 활성화/비활성화">
        <input type="checkbox" id="enabledToggle" />
        <span class="slider"></span>
      </label>
    </header>

    <div class="tab-banner" id="tabBanner">
      <span class="dot" id="tabDot"></span>
      <span id="tabStatusText">현재 탭 확인 중...</span>
    </div>

    <div class="site-pills">
      <label class="site-pill">
        <input type="checkbox" id="siteChatGpt" checked />
        <span class="site-pill-dot chatgpt"></span>
        <span>ChatGPT</span>
      </label>
      <label class="site-pill">
        <input type="checkbox" id="siteClaude" checked />
        <span class="site-pill-dot claude"></span>
        <span>Claude.ai</span>
      </label>
    </div>

    <section class="card">
      <div class="section-label">Decision Model 백엔드</div>
      <div class="segmented" role="tablist" aria-label="Provider">
        <button type="button" class="seg-btn" data-provider="openrouter">OpenRouter</button>
        <button type="button" class="seg-btn" data-provider="openai">OpenAI</button>
        <button type="button" class="seg-btn" data-provider="local">Local</button>
      </div>

      <!-- OpenRouter panel -->
      <div class="provider-panel" data-panel="openrouter">
        <div class="field">
          <label for="openrouterKey">OpenRouter API Key</label>
          <div class="input-row">
            <input type="password" id="openrouterKey" placeholder="sk-or-v1-..." autocomplete="off" />
            <button type="button" class="icon-btn" data-toggle-secret="openrouterKey" title="표시/숨기기">👁</button>
          </div>
        </div>
        <div class="field">
          <label for="openrouterModel">모델 (Jev Decision Model)</label>
          <input type="text" id="openrouterModel" placeholder="typesafe/jev-latest" />
        </div>
      </div>

      <!-- OpenAI panel -->
      <div class="provider-panel hidden" data-panel="openai">
        <div class="field">
          <label for="openaiKey">OpenAI API Key</label>
          <div class="input-row">
            <input type="password" id="openaiKey" placeholder="sk-..." autocomplete="off" />
            <button type="button" class="icon-btn" data-toggle-secret="openaiKey" title="표시/숨기기">👁</button>
          </div>
        </div>
        <div class="field">
          <label for="openaiModel">모델 (Decisions API)</label>
          <input type="text" id="openaiModel" placeholder="gpt-6-luna" />
        </div>
      </div>

      <!-- Local panel -->
      <div class="provider-panel hidden" data-panel="local">
        <div class="field">
          <label for="localUrl">로컬 엔드포인트 URL</label>
          <input type="url" id="localUrl" placeholder="http://localhost:11434/v1/systemone" />
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="localFormat">API 포맷</label>
            <select id="localFormat">
              <option value="systemone">Ollama / System One (noul)</option>
              <option value="openai-decisions">vLLM / OpenAI (predicate)</option>
            </select>
          </div>
          <div class="field">
            <label for="localModel">모델명</label>
            <input type="text" id="localModel" placeholder="tev1" />
          </div>
        </div>
        <div class="field">
          <label for="localKey">API Key (선택 · vLLM/프록시용)</label>
          <div class="input-row">
            <input type="password" id="localKey" placeholder="비워 두어도 됩니다" autocomplete="off" />
            <button type="button" class="icon-btn" data-toggle-secret="localKey" title="표시/숨기기">👁</button>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="section-label">감지 설정</div>

      <div class="field">
        <div class="field-head">
          <label for="thresholdRange">주제 전환 민감도 (임계값)</label>
          <span class="mono-pill" id="thresholdValue">75%</span>
        </div>
        <input type="range" id="thresholdRange" min="0.50" max="0.95" step="0.05" value="0.75" />
        <div class="range-hints">
          <span>민감 (50%)</span>
          <span>균형 (75%)</span>
          <span>보수적 (95%)</span>
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="minTurns">최소 대화 턴 수</label>
          <input type="number" id="minTurns" min="1" max="20" step="1" value="2" />
        </div>
        <div class="field">
          <label for="modeSelect">감지 시 동작</label>
          <select id="modeSelect">
            <option value="block">모달로 확인 (권장)</option>
            <option value="advisory">전송 후 토스트 알림</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="languageSelect">안내 언어</label>
        <select id="languageSelect">
          <option value="auto">자동 감지 (한국어/English)</option>
          <option value="ko">한국어</option>
          <option value="en">English</option>
        </select>
      </div>

      <label class="checkbox-row">
        <input type="checkbox" id="autoSendOnNewChat" />
        <span>새 대화로 프롬프트 이동 후 자동 전송</span>
      </label>

      <label class="checkbox-row">
        <input type="checkbox" id="showDebugToast" />
        <span>디버그 토스트 표시 (통과 시에도 확률·지연 확인)</span>
      </label>

      <details class="advanced">
        <summary>고급 설정</summary>
        <div class="advanced-body">
          <div class="grid-2">
            <div class="field">
              <label for="timeoutMs">타임아웃 (ms)</label>
              <input type="number" id="timeoutMs" min="500" max="15000" step="100" value="3000" />
            </div>
            <div class="field">
              <label for="maxWindowTurns">컨텍스트 턴 수</label>
              <input type="number" id="maxWindowTurns" min="2" max="30" step="1" value="10" />
            </div>
          </div>
          <div class="grid-2">
            <div class="field">
              <label for="minPromptChars">최소 프롬프트 글자</label>
              <input type="number" id="minPromptChars" min="1" max="200" step="1" value="8" />
            </div>
            <div class="field">
              <label for="minContextChars">최소 컨텍스트 글자</label>
              <input type="number" id="minContextChars" min="0" max="5000" step="10" value="80" />
            </div>
          </div>
          <label class="checkbox-row">
            <input type="checkbox" id="showCheckingPill" checked />
            <span>확인 중 플로팅 인디케이터 표시</span>
          </label>
        </div>
      </details>
    </section>

    <div class="action-bar">
      <button type="button" class="btn btn-secondary" id="testBtn">API 테스트</button>
      <button type="button" class="btn btn-primary" id="saveBtn">설정 저장</button>
    </div>

    <div class="feedback hidden" id="feedbackBox"></div>

    <section class="card last-eval-card">
      <div class="section-label-row">
        <span class="section-label">최근 판정 기록</span>
        <span class="eval-time" id="lastEvalTime"></span>
      </div>
      <div class="eval-body" id="lastEvalBody">아직 ChatGPT / Claude.ai에서 판정한 기록이 없습니다.</div>
    </section>

    <footer class="footer">
      API 키는 브라우저 로컬 저장소에만 보관되며 선택한 Decision API 외 전송되지 않습니다.
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
